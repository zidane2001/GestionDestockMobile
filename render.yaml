# Blueprint Render du site Ma Boutique.
# Le code du site se trouve dans site/ ; ce fichier doit rester à la racine
# du dépôt pour que Render le détecte.
services:
  - type: web
    name: ma-boutique-site
    runtime: node
    plan: free
    region: frankfurt
    rootDir: site
    buildCommand: npm ci --omit=dev && node scripts/preparer-apk.mjs
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Source de l'APK : stockage objet du projet. Le visiteur ne la voit jamais,
      # il télécharge depuis le domaine du site (voir /telechargement/).
      - key: LIEN_APK
        value: https://br-empty-wave-b515tz37.storage.c-7.us-east-2.aws.neon.tech/versions/ma-boutique.apk
